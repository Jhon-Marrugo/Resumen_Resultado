<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <title>Resumen de Resultados</title>
</head>
<body>
  <div class="tarjeta">

    <div class="izquierda">
      <p>Your Result</p>
      <div class="circulo">
        <h1>76</h1>
        <p>of 100</p>
      </div>
      <h2>Great</h2>
      <p>You scored higher than 65% of the people who have taken these tests.</p>
    </div>

    <div class="derecha">
      <h3>Summary</h3>
      <div class="reaction">
        <p><i class="fa-solid fa-bolt"></i> Reaction</p>
        <p style="color: hsl(224, 30%, 27%);"><strong>80</strong> / 100</p>
      </div>
      <div class="memory"> 
        <p><i class="fa-regular fa-clock"></i> Memory</p>
        <p style="color: hsl(224, 30%, 27%);"><strong>92</strong> / 100</p>
      </div> 
      <div class="verbal"> 
        <p><i class="fa-regular fa-message"></i> Verbal</p>
        <p style="color: hsl(224, 30%, 27%);"><strong>61</strong> / 100</p>
      </div> 
      <div class="visual"> 
        <p><i class="fa-solid fa-eye"></i> Visual</p>
        <p style="color: hsl(224, 30%, 27%);"><strong>72</strong> / 100</p>
      </div> 
      <a href="#">Continue</a>
    </div>
    </div>
    
</body>
</html>
